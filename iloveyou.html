<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>spesial for u</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fffbf5;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    #hc {
      position: relative;
      width: 420px;
      height: 420px;
    }
    .lw {
      position: absolute;
      font-family: 'Courier New', monospace;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transform-origin: center center;
    }
    @keyframes fadeIn {
      0%   { opacity: 0; transform: scale(0.7); }
      30%  { opacity: 1; transform: scale(1); }
      70%  { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <div id="hc"></div>

  <script>
    const c = document.getElementById('hc');
    const W = 420, H = 420;

    function hx(t) { return 16 * Math.pow(Math.sin(t), 3); }
    function hy(t) { return -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t)); }

    const sc = 12.5, cx = W/2, cy = H/2 + 18;
    const phrases = ["I LOVE YOU 🫰","I LOVE YOU 🫰","I LOVE YOU 🫰","I LOVE YOU 🫰","I LOVE YOU 🫰","I LOVE YOU 🫰"];
    const colors  = ["#ff2244","#ff4466","#ff6680","#ff1133","#cc0022","#ff3355"];

    const pts = [];
    for (let i = 0; i < 120; i++) {
      const t = (i / 120) * 2 * Math.PI;
      pts.push({ px: cx + hx(t)*sc, py: cy + hy(t)*sc });
    }

    pts.sort((a, b) => {
      const ai = Math.round(a.py / 14);
      const bi = Math.round(b.py / 14);
      return ai !== bi ? ai - bi : a.px - b.px;
    });

    const placed = [];
    const fs = 11, charW = 6.5, ph = fs * 1.3;

    function overlaps(nx, ny, nw, nh) {
      for (const p of placed) {
        if (nx < p.x+p.w+2 && nx+nw+2 > p.x && ny < p.y+p.h+2 && ny+nh+2 > p.y) return true;
      }
      return false;
    }

    const queue = [];
    let slot = 0;

    for (const { px, py } of pts) {
      const word = phrases[slot % phrases.length];
      const nw = word.length * charW;
      const ax = px - nw/2, ay = py - ph/2;
      if (!overlaps(ax, ay, nw, ph)) {
        placed.push({ x: ax, y: ay, w: nw, h: ph });
        queue.push({ px, py, word, color: colors[slot % colors.length], delay: slot * 60 });
        slot++;
      }
    }

    queue.forEach(({ px, py, word, color, delay }) => {
      const span = document.createElement('span');
      span.className = 'lw';
      span.textContent = word;
      span.style.fontSize = fs + 'px';
      span.style.color = color;
      span.style.left = (px - word.length * charW / 2) + 'px';
      span.style.top  = (py - ph / 2) + 'px';
      c.appendChild(span);

      function animate() {
        const dur = 2800 + Math.random() * 800;
        span.style.animation = 'none';
        span.offsetHeight;
        span.style.animation = `fadeIn ${dur}ms ease-in-out forwards`;
        setTimeout(() => {
          setTimeout(animate, 200 + Math.random() * 400);
        }, dur);
      }

      setTimeout(animate, delay);
    });
  </script>
</body>
</html>
